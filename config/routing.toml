# Routing Policy Configuration
[routing]
default_chain = ["ollama:qwen3.5:4b", "gemini:gemini-2.5-flash"]

# Small-to-medium coding requests -> qwen2.5-coder:7b
[[routing.rules]]
intent = "coding"
max_complexity = 3
privacy = "normal"
chain = ["ollama:qwen2.5-coder:7b", "gemini:gemini-2.5-flash"]

# Complex coding / architectural tasks -> gemini escalation
[[routing.rules]]
intent = "coding"
min_complexity = 4
privacy = "normal"
chain = ["gemini:gemini-2.5-flash", "ollama:qwen2.5-coder:7b"]

# Office documents -> qwen3.5:4b
[[routing.rules]]
intent = "office"
privacy = "normal"
chain = ["ollama:qwen3.5:4b", "gemini:gemini-2.5-flash"]

# Web research -> Gemini (or qwen3.5:4b fallback)
[[routing.rules]]
intent = "web"
privacy = "normal"
chain = ["gemini:gemini-2.5-flash", "ollama:qwen3.5:4b"]

# System commands -> qwen3.5:4b local
[[routing.rules]]
intent = "system"
privacy = "normal"
chain = ["ollama:qwen3.5:4b"]

# Simple general conversation -> qwen3.5:4b
[[routing.rules]]
intent = "general"
max_complexity = 2
privacy = "normal"
chain = ["ollama:qwen3.5:4b"]

# Local-only privacy rule: NEVER ROUTE TO GEMINI OR CLOUD
[[routing.rules]]
privacy = "local_only"
chain = ["ollama:qwen3.5:4b", "ollama:qwen2.5-coder:7b"]
